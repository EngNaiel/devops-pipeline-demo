apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-pipeline-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EngNaiel/devops-pipeline-demo
    targetRevision: main
    path: helm
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true